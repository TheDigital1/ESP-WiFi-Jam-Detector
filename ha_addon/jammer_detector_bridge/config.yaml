# SPDX-License-Identifier: GPL-3.0-or-later
name: Jammer Detector Bridge
version: "0.1.0"
slug: jammer_detector_bridge
description: Connects an esp-wifi-jammer-detector on USB to Home Assistant through MQTT.
url: https://github.com/TheDigital1/ESP-WiFi-Jam-Detector
arch:
  - aarch64
  - amd64
init: false
services:
  - mqtt:need
options:
  device: null
  log_level: info
schema:
  device: device(subsystem=tty)
  log_level: list(debug|info|warning|error)
